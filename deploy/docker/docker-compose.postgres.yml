# AlertLoop production Compose profile: separate API and worker containers
# backed by PostgreSQL.
#
# Configuration comes from a SINGLE source of truth: alertloop.yaml (next to
# this file). Both the api and worker containers mount the SAME file, so the
# channel configuration (email/telegram/webhook) is defined in exactly one
# place and can never drift between the two services.
#
# Setup:
#   1. cp alertloop.yaml.example alertloop.yaml   (in this directory)
#   2. edit alertloop.yaml: set admin_token, api_keys, and your channels
#   3. docker compose -f deploy/docker/docker-compose.postgres.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    # Note: no `ports:` — Postgres stays on the internal Docker network only and
    # is never published to the host. Keep it that way.
    environment:
      POSTGRES_USER: alertloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alertloop}
      POSTGRES_DB: alertloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertloop"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The Postgres image needs a writable data dir and some caps to drop from
    # root to the postgres user, so only no-new-privileges is applied here.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  api:
    build:
      context: ../..
      args:
        VERSION: compose-pg
    image: alertloop:latest
    command: ["--config", "/etc/alertloop/alertloop.yaml", "server"]
    environment:
      # The runtime image bakes ALERTLOOP_DB_DSN=/data/alertloop.db (the sqlite default), and env
      # overrides YAML. Blank it so the postgres dsn in alertloop.yaml stays authoritative for this
      # profile; still overridable by setting a real ALERTLOOP_DB_DSN in the environment/.env.
      ALERTLOOP_DB_DSN: ${ALERTLOOP_DB_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback-only: a published Docker port bypasses host firewalls like ufw.
      # Put the HTTPS reverse proxy from deploy/proxy/ in front for public access.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    image: alertloop:latest
    command: ["--config", "/etc/alertloop/alertloop.yaml", "worker"]
    environment:
      # Same reason as the api service: neutralise the image's baked-in sqlite ALERTLOOP_DB_DSN so
      # the postgres dsn from alertloop.yaml wins (both containers must agree on the database).
      ALERTLOOP_DB_DSN: ${ALERTLOOP_DB_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # The admin console is served by the `api` container at /admin (same origin) —
  # no separate service needed. Open http://localhost:8080/admin.

volumes:
  pgdata:
