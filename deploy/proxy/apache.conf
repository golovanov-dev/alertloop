# Example Apache 2.4 reverse proxy for AlertLoop, terminating HTTPS and
# forwarding to the AlertLoop binary/container on 127.0.0.1:8080. The whole app
# — JSON API, admin console (/admin), Swagger (/swagger), health — is one
# origin, so a single ProxyPass covers everything.
#
# Requires these modules:  a2enmod proxy proxy_http ssl headers
# Place in /etc/apache2/sites-available/alertloop.conf, then:
#   a2ensite alertloop && apache2ctl configtest && systemctl reload apache2
# Get a certificate with e.g. certbot: certbot --apache -d alerts.example.com

<VirtualHost *:80>
    ServerName alerts.example.com
    # Redirect all HTTP to HTTPS.
    Redirect permanent / https://alerts.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName alerts.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/alerts.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/alerts.example.com/privkey.pem

    # Cap request bodies (app payload limit is 256 KB).
    LimitRequestBody 1048576

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
