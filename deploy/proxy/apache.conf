# Example Apache 2.4 reverse proxy for AlertLoop, terminating HTTPS and
# forwarding to the AlertLoop binary/container on 127.0.0.1:8080. The whole app
# — JSON API, admin console (/admin), Swagger (/swagger), health — is one
# origin, so a single ProxyPass covers everything.
#
# Requires these modules:  a2enmod proxy proxy_http ssl headers
# Place in /etc/apache2/sites-available/alertloop.conf, then:
#   a2ensite alertloop && apache2ctl configtest && systemctl reload apache2
# Get a certificate with e.g. certbot: certbot --apache -d alerts.example.com

<VirtualHost *:80>
    ServerName alerts.example.com
    # Redirect all HTTP to HTTPS.
    Redirect permanent / https://alerts.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName alerts.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/alerts.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/alerts.example.com/privkey.pem

    # Cap request bodies (app payload limit is 256 KB).
    LimitRequestBody 1048576

    # Rate limiting. Needed, not optional: behind a proxy every request reaches
    # AlertLoop from 127.0.0.1, so unless you also set
    #
    #   rate_limit:
    #     trusted_proxies: ["127.0.0.1"]
    #
    # in alertloop.yaml, the app's own per-IP limiter sees ONE client and puts
    # the whole internet in a single bucket - unlimited guessing at the admin
    # token, and one noisy client getting everyone else a 429. Set both.
    #
    # Apache has no equivalent of nginx's limit_req in the base install.
    # Options, in order of preference:
    #
    #   1. mod_qos (a2enmod qos):
    #        QS_SrvMaxConnPerIP 20
    #        QS_LocRequestLimitMatch "^/(admin|events|deliveries)" 10
    #
    #   2. mod_evasive (a2enmod evasive):
    #        DOSPageCount 5
    #        DOSSiteCount 50
    #        DOSPageInterval 1
    #        DOSBlockingPeriod 60
    #
    #   3. fail2ban on the access log, if you cannot add a module.
    #
    # If none of these is available, prefer the nginx configuration next door.

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # Health probes are exempt from any limiter you add above: an uptime check
    # must keep answering during an incident, which is when it is asked.
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
