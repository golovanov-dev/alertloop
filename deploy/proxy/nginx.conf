# Example nginx reverse proxy for AlertLoop, terminating HTTPS and forwarding to
# the AlertLoop binary/container on 127.0.0.1:8080. The whole app — JSON API,
# admin console (/admin), Swagger (/swagger), health — is one origin, so a
# single proxy block covers everything.
#
# Place in /etc/nginx/sites-available/alertloop.conf, symlink into sites-enabled,
# then: nginx -t && systemctl reload nginx
# Get a certificate with e.g. certbot: certbot --nginx -d alerts.example.com

# Rate limiting. THIS IS NOT OPTIONAL DECORATION.
#
# AlertLoop has its own per-IP limiter, but behind a proxy every request reaches
# it from 127.0.0.1, so without `rate_limit.trusted_proxies` in alertloop.yaml
# the app sees one client and puts the whole internet in a single bucket. Two
# consequences, both bad: brute-forcing the admin token is effectively
# unlimited, and one noisy client exhausts the shared bucket and gets every
# legitimate event source a 429.
#
# Do BOTH of these:
#   1. keep the limits below, so abuse is stopped before it reaches the app;
#   2. set trusted_proxies in alertloop.yaml so the app can tell clients apart:
#
#        rate_limit:
#          trusted_proxies: ["127.0.0.1"]
#
# These zones must live in the `http` context. If you include this file from
# sites-enabled (which is inside `http`), they work as written.
#
# 10m holds roughly 160 000 addresses. Sizing: `rate` is the sustained ceiling,
# `burst` absorbs a spike, `nodelay` serves the burst immediately instead of
# queueing it.
limit_req_zone $binary_remote_addr zone=alertloop_api:10m rate=20r/s;
# Authentication endpoints get a much tighter budget: the admin console signs in
# once, an event source never uses these, and a password guesser needs
# thousands of tries.
limit_req_zone $binary_remote_addr zone=alertloop_admin:10m rate=2r/s;
limit_req_status 429;

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name alerts.example.com;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` (not the separate `http2 on;` directive) works everywhere: nginx < 1.25.1
    # only understands this form, and newer nginx still honours it (with a deprecation notice).
    # Prefer it in a config shipped to unknown environments.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alerts.example.com;

    ssl_certificate     /etc/letsencrypt/live/alerts.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alerts.example.com/privkey.pem;

    # Optional: restrict the whole service to trusted IPs (defence in depth on top of the admin
    # token). Uncomment and set your address(es). Keep this on the 443 block ONLY — the port 80
    # server above must stay reachable so Let's Encrypt can renew the certificate.
    #   allow 203.0.113.45;       # your office/home IP  (find it: curl ifconfig.me)
    #   allow 198.51.100.0/24;    # or a whole range
    #   deny  all;                # everyone else gets 403

    # Event payloads are capped at 256 KB by the app; keep the proxy in step.
    client_max_body_size 1m;

    # The admin console and the token-protected pages: the places worth guessing
    # at. A tight budget here costs a legitimate operator nothing.
    location ~ ^/(admin|events|deliveries) {
        limit_req zone=alertloop_admin burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    # Health probes are exempt. An uptime check runs every few seconds from one
    # address, and throttling it would make "is it up?" stop answering during an
    # incident - which is when the question gets asked. They touch nothing but a
    # database ping.
    location ~ ^/(health|ready) {
        access_log off;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # burst=40 matches the app's own per-IP burst, so the two limiters do
        # not disagree about what a legitimate spike looks like.
        limit_req zone=alertloop_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
