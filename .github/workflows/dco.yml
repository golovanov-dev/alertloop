name: DCO

on:
  pull_request:
    branches: ["**"]

# Verifies that every non-merge commit in the pull request carries a
# `Signed-off-by:` trailer, as required by CONTRIBUTING.md / the DCO.
jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-off
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $c is missing a Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add sign-off with 'git commit -s' (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "All commits are signed off."
