name: CI

# Static analysis, tests, and formatting on every push and pull request. The
# slow delivery checks (upgrade, compose-up) run only on release/** branches,
# v* tags, and manual dispatch — see `if:` on those jobs.
#
# Go is pinned to a release that still receives security fixes (1.27), matching
# the Dockerfile and the release workflow — that toolchain builds the shipped
# artifacts. It deliberately does NOT match the lower `go` directive in go.mod,
# which is the minimum needed to build from source and stays low so contributors
# on an older toolchain are not locked out. Node matches the Dockerfile (22).
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  go:
    name: Go (vet, test, gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # gofmt first: it is the cheapest check and the most annoying to discover
      # after a long test run. `gofmt -l` prints offending files and exits 0, so
      # a non-empty output has to be turned into a failure explicitly.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt: clean"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # v8, not v6: the action's major version and the linter's are coupled.
      # v6 runs golangci-lint v1 only, and .golangci.yml is a v2 config
      # (`version: "2"`), so v6 failed on every run regardless of the code.
      # Keep these two in step when bumping either.
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, not `latest`. A new linter release adds checks, and with
          # `latest` it lands in CI on whatever day upstream ships it - which is
          # as likely as not the day you are trying to cut a release. Bump this
          # deliberately, in its own commit.
          version: v2.13.1
          # No --timeout here: run.timeout lives in .golangci.yml, and one
          # place to set it is enough.

  postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    # PostgreSQL is the production database, and until 0.4.0 nothing was tested
    # against it: every test ran on SQLite. The two differ exactly where it
    # matters — placeholder syntax, JSONB payloads, partial indexes, and
    # `FOR UPDATE SKIP LOCKED`, which is the entire basis of the delivery queue.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alertloop
          POSTGRES_PASSWORD: alertloop
          POSTGRES_DB: alertloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alertloop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      ALERTLOOP_TEST_POSTGRES_DSN: postgres://alertloop:alertloop@127.0.0.1:5432/alertloop_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # -count=1 defeats the test cache: these tests depend on a database the
      # cache knows nothing about, so a cached PASS would be meaningless.
      - name: Storage tests against PostgreSQL
        run: go test -count=1 ./internal/storage/...

      # The suite must actually have run. A skipped integration suite reports
      # the same green tick as a passing one, which is how "we test PostgreSQL"
      # quietly becomes false.
      - name: Assert the PostgreSQL tests were not skipped
        run: |
          go test -count=1 -v -run 'TestPostgres' ./internal/storage/ > result.txt
          cat result.txt
          if grep -q -- '--- SKIP' result.txt; then
            echo "::error::PostgreSQL tests were skipped; the DSN did not reach them."
            exit 1
          fi
          passed=$(grep -c -- '--- PASS' result.txt || true)
          if [ "$passed" -lt 5 ]; then
            echo "::error::only $passed PostgreSQL tests passed; expected the full suite."
            exit 1
          fi
          echo "PostgreSQL integration tests: $passed passed"

  upgrade:
    name: Upgrade from v0.1.0
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # An upgrade runs against data somebody cares about, on a machine we will
    # never see. It gets tested with the real old binary, not a reconstruction.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alertloop
          POSTGRES_PASSWORD: alertloop
          POSTGRES_DB: alertloop_upgrade
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U alertloop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # The script builds the old release from its tag, so the full history has
      # to be there.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Upgrade test (SQLite and PostgreSQL)
        env:
          ALERTLOOP_TEST_POSTGRES_DSN: postgres://alertloop:alertloop@127.0.0.1:5433/alertloop_upgrade?sslmode=disable
        run: bash scripts/upgrade-test.sh

  compose:
    name: Compose file
    runs-on: ubuntu-latest
    # Both deployment profiles live in one file now. A typo in it does not fail
    # any test — it fails somebody's install, which is how 0.3.0 shipped a
    # production profile that started on a placeholder admin token.
    steps:
      - uses: actions/checkout@v4
      # Both profiles must parse with no .env at all: Compose interpolates the
      # whole file before it filters by profile, so a required-variable guard on
      # one profile would block the other. That is why the missing-secret guard
      # lives in the config file (covered by TestExampleConfigRefusesWithoutAnAdminToken)
      # rather than here.
      - name: Validate both profiles with no .env
        run: |
          rm -f .env
          docker compose --profile demo config --quiet
          docker compose --profile postgres config --quiet
          echo "both profiles parse without a .env"

      - name: Validate both profiles with the example .env
        run: |
          cp .env.example .env
          docker compose --profile demo config --quiet
          docker compose --profile postgres config --quiet
          echo "both profiles parse with .env.example"

      # Exactly one profile may claim port 8080, or `docker compose up` fails on
      # a port collision after the user has already been told it would work.
      # COMPOSE_PROFILES is cleared per case so that the flag alone selects the
      # profile, whatever .env.example sets.
      - name: Each profile publishes port 8080 exactly once
        run: |
          for profile in demo postgres; do
            count=$(COMPOSE_PROFILES= docker compose --profile "$profile" config \
              | grep -c 'published: *"8080"' || true)
            if [ "$count" != "1" ]; then
              echo "::error::profile $profile publishes port 8080 $count times, expected 1."
              COMPOSE_PROFILES= docker compose --profile "$profile" config
              exit 1
            fi
          done
          echo "port 8080 is claimed once per profile"

      # Selecting a profile the documented way — by editing COMPOSE_PROFILES —
      # must also yield exactly one service on 8080.
      - name: COMPOSE_PROFILES selects one deployment
        run: |
          for profile in demo postgres; do
            count=$(COMPOSE_PROFILES="$profile" docker compose config \
              | grep -c 'published: *"8080"' || true)
            if [ "$count" != "1" ]; then
              echo "::error::COMPOSE_PROFILES=$profile publishes port 8080 $count times, expected 1."
              exit 1
            fi
          done
          echo "COMPOSE_PROFILES selects exactly one deployment"

      # The host port is ALERTLOOP_PORT, 8080 when unset (checked above). It
      # must move the host side of the mapping in both profiles, and it must
      # stay a Compose variable: nothing may hand it to a container.
      - name: ALERTLOOP_PORT moves the host port and stays out of the containers
        run: |
          for profile in demo postgres; do
            out=$(COMPOSE_PROFILES= ALERTLOOP_PORT=18080 docker compose --profile "$profile" config)
            moved=$(echo "$out" | grep -c 'published: *"18080"' || true)
            stale=$(echo "$out" | grep -c 'published: *"8080"' || true)
            if [ "$moved" != "1" ] || [ "$stale" != "0" ]; then
              echo "::error::profile $profile: ALERTLOOP_PORT=18080 published 18080 $moved time(s) and 8080 $stale time(s)."
              echo "$out"
              exit 1
            fi
            if echo "$out" | grep -q 'ALERTLOOP_PORT'; then
              echo "::error::profile $profile passes ALERTLOOP_PORT into a container."
              exit 1
            fi
          done
          echo "ALERTLOOP_PORT moves the host port in both profiles"

  compose-up:
    name: Compose postgres profile starts healthy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    # The compose job above proves the file parses. This one proves the stack
    # it describes comes up — built from this tree, with a database password
    # full of the characters that used to break the DSN — and that a stack that
    # cannot start is reported as a failure by `up --wait` instead of looking
    # like a running one.
    env:
      # Every character the pre-0.5.1 URL DSN broke on, plus a literal %2F.
      PW: "Tr5Lw9Bq/Kx2+Nm7=@:#?%2F"
    steps:
      - uses: actions/checkout@v4

      - name: Build the image from this tree
        run: docker build --build-arg VERSION=ci -t alertloop:ci .

      - name: The image refuses to start without an admin token, naming it
        run: |
          rc=0
          out=$(docker run --rm alertloop:ci 2>&1) || rc=$?
          echo "$out"
          if [ "$rc" -eq 0 ] || ! grep -q 'ALERTLOOP_ADMIN_TOKEN' <<< "$out"; then
            echo "::error::docker run without ALERTLOOP_ADMIN_TOKEN did not refuse with a message naming it"
            exit 1
          fi

      # The password contains "#", so it goes in single quotes in .env — what
      # the install guide and .env.example tell you to do with one like it.
      - name: Write .env and alertloop.yaml as the install guide says
        run: |
          write_env() {
            grep -v -E '^(COMPOSE_PROFILES|ALERTLOOP_ADMIN_TOKEN|POSTGRES_PASSWORD)=' .env.example
            echo "COMPOSE_PROFILES=postgres"
            echo "ALERTLOOP_ADMIN_TOKEN=$1"
            echo "POSTGRES_PASSWORD='$PW'"
            echo "ALERTLOOP_IMAGE=alertloop:ci"
            echo "ALERTLOOP_PORT=18080"
          }
          write_env "ci-admin-token" > .env
          cp alertloop.example.yaml alertloop.yaml

      - name: up --wait succeeds, and both AlertLoop containers are healthy
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
          for svc in api worker; do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$svc")")
            if [ "$status" != "healthy" ]; then
              echo "::error::$svc is $status after up --wait"
              exit 1
            fi
          done
          curl -fsS http://127.0.0.1:18080/health/ready
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/v1/events \
            -H "X-API-Key: ci-admin-token" -H 'Content-Type: application/json' \
            -d '{"type":"incident","severity":"info","source":"ci","message":"compose smoke test"}')
          if [ "$code" != "201" ]; then
            echo "::error::POST /v1/events returned $code, want 201"
            exit 1
          fi
          echo "the stack is up on port 18080, both containers healthy, and it stores events"

      - name: Logs, if the stack did not come up
        if: failure()
        run: docker compose logs --no-color --tail=200

      # The failure this whole setup exists to expose: containers created,
      # AlertLoop failing at startup in a restart loop. Plain `up -d` reports
      # success for that; `up --wait --wait-timeout` must not. Here the cause is
      # a missing admin token, which AlertLoop refuses to start without.
      #
      # `timeout` is a guard, not the check. Compose's own --wait-timeout must be
      # what ends the command: exit 124 means the outer timeout killed a Compose
      # that was still waiting, i.e. --wait-timeout did not work, and that is
      # reported as a failure rather than mistaken for the expected refusal.
      - name: up --wait fails when AlertLoop cannot start
        run: |
          docker compose down -v
          write_env() {
            grep -v -E '^(COMPOSE_PROFILES|ALERTLOOP_ADMIN_TOKEN|POSTGRES_PASSWORD)=' .env.example
            echo "COMPOSE_PROFILES=postgres"
            echo "ALERTLOOP_ADMIN_TOKEN="
            echo "POSTGRES_PASSWORD='$PW'"
            echo "ALERTLOOP_IMAGE=alertloop:ci"
            echo "ALERTLOOP_PORT=18080"
          }
          write_env > .env
          rc=0
          timeout 240 docker compose up -d --wait --wait-timeout 90 || rc=$?
          docker compose ps
          if [ "$rc" -eq 0 ]; then
            echo "::error::up --wait reported success for a stack whose api cannot start"
            exit 1
          fi
          if [ "$rc" -eq 124 ]; then
            echo "::error::up --wait was still waiting after 240s and had to be killed; --wait-timeout 90 did not end it"
            exit 1
          fi
          echo "a stack that cannot start fails up --wait (exit $rc)"

      - name: Clean up
        if: always()
        run: docker compose down -v || true

  monit-integration:
    name: Monit integration (shellcheck, tests)
    runs-on: ubuntu-latest
    # The integration is shipped, supported code that runs as root on somebody
    # else's server. It gets the same bar as the Go: a linter and a test suite,
    # on every push.
    steps:
      - uses: actions/checkout@v4

      # First, because everything after it depends on being able to RUN these.
      #
      # 0.4.1 shipped every one of them non-executable: they were authored on a
      # machine with core.filemode=false, where `chmod +x` never reaches git's
      # index, so the mode stayed 100644 and a Linux checkout produced
      # "Permission denied" - 74 test failures with one cause. The mode is
      # checked here rather than on disk, because git's recorded mode is what a
      # clone actually gets, and it is verifiable from any platform.
      - name: The shipped scripts are executable
        run: |
          expected="integrations/monit/alertloop-send
          integrations/monit/alertloop-monit
          integrations/monit/install.sh
          integrations/monit/uninstall.sh
          integrations/monit/examples/check-worker-heartbeat.sh
          integrations/monit/examples/cron-wrapper.sh
          integrations/monit/examples/check-pm2.sh
          integrations/monit/test/run-tests.sh
          scripts/upgrade-test.sh
          scripts/build-release.sh
          deploy/systemd/install.sh"
          bad=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            mode="$(git ls-files -s -- "$f" | awk '{print $1}')"
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::mode is ${mode:-missing}, expected 100755 (git update-index --chmod=+x $f)"
              bad=1
            elif [ ! -x "$f" ]; then
              echo "::error file=$f::not executable in the checkout"
              bad=1
            fi
          done <<< "$expected"
          [ "$bad" -eq 0 ] || exit 1
          echo "every shipped script is executable"

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq

      # -x follows sourced files; -S style is the strictest level. Every script
      # here is one somebody will read while their production is on fire.
      - name: shellcheck
        run: |
          shellcheck -x -S style \
            integrations/monit/alertloop-send \
            integrations/monit/alertloop-monit \
            integrations/monit/install.sh \
            integrations/monit/uninstall.sh \
            integrations/monit/examples/*.sh \
            integrations/monit/test/run-tests.sh \
            scripts/upgrade-test.sh
          echo "shellcheck: clean"

      - name: Adapter tests
        run: bash integrations/monit/test/run-tests.sh

      # A shell tool runs under whatever locale the host has and pipes through
      # `tr`, which is byte-oriented. A multi-byte character in a literal is one
      # LC_ALL=C away from arriving as mojibake in somebody's alert, so the
      # scripts stay ASCII and this proves it. (Text the CALLER supplies is
      # passed through untouched; that is not what this checks.)
      - name: The shipped scripts are ASCII
        run: |
          bad=0
          for f in integrations/monit/alertloop-send \
                   integrations/monit/alertloop-monit \
                   integrations/monit/examples/*.sh; do
            if LC_ALL=C grep -qP '[^\x00-\x7F]' "$f"; then
              echo "::error file=$f::contains non-ASCII characters"
              LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "all shipped scripts are ASCII"

      # Monit itself validates the example rules. A rule that does not parse is
      # a rule that silently monitors nothing.
      - name: Monit accepts the example rules
        run: |
          sudo apt-get install -y -qq monit
          sudo install -d -m 0755 /etc/alertloop
          sudo install -m 0600 integrations/monit/alertloop.env.example /etc/alertloop/monit.env
          sudo install -m 0755 integrations/monit/alertloop-send  /usr/local/bin/alertloop-send
          sudo install -m 0755 integrations/monit/alertloop-monit /usr/local/bin/alertloop-monit

          # Monit refuses to read a control file that others can write, and
          # rejects rules referencing programs that do not exist - so the
          # helpers go in first.
          sudo install -m 0755 integrations/monit/examples/check-worker-heartbeat.sh /usr/local/bin/
          sudo install -m 0755 integrations/monit/examples/cron-wrapper.sh /usr/local/bin/
          sudo install -m 0755 integrations/monit/examples/check-pm2.sh /usr/local/bin/

          # The synthetic control file carries a mail server because
          # alertloop.conf uses the bare `alert` action, and Monit refuses a
          # configuration that alerts with nowhere to send. That is a property
          # of this two-line harness, not of the rule being checked.
          failed=0
          for f in integrations/monit/conf.d/*.conf; do
            name="$(basename "$f")"
            rc="/tmp/monitrc.$name"
            {
              echo 'set daemon 30'
              echo 'set pidfile /run/monit-check.pid'
              echo 'set mailserver localhost'
              echo 'set alert root@localhost'
              cat "$f"
            } | sudo tee "$rc" >/dev/null
            sudo chmod 0600 "$rc"
            if sudo monit -t -c "$rc"; then
              echo "  ok   $name"
            else
              echo "::error file=$f::monit -t rejected this rule file"
              failed=1
            fi
          done
          # Report every broken file, not just the first: fixing them one CI
          # run at a time is how a five-minute job becomes an afternoon.
          [ "$failed" -eq 0 ] || exit 1
          echo "every example rule parses"

  admin-ui:
    name: Admin console (typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        working-directory: web/admin
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web/admin
        run: npm run typecheck

      # `npm run build` runs tsc --noEmit and then Vite; it catches breakage that
      # typecheck alone misses (bad imports, asset resolution) before a release
      # tag depends on it.
      - name: Build
        working-directory: web/admin
        run: npm run build

  vulncheck:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    # Criterion 5 of the 1.0.0 bar: dependency scanning in CI. govulncheck
    # reports only vulnerabilities in code paths this binary actually reaches,
    # so a finding here is a finding worth acting on rather than noise.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
