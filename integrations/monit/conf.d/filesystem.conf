# Filesystems: space, inodes, and mount flags.
#
# COPY, THEN EDIT: the paths and the device names are yours, not these.
# List every filesystem that matters separately. A full /var takes down the
# database; a full /home usually does not.

check filesystem filesystem-root with path /

  # Two thresholds, two incidents. The warning gives you the evening to clean
  # up; the critical one is the "it will stop working tonight" message.
  if space usage > 80% for 3 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning usage"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved usage"

  if space usage > 92% for 2 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical usage-critical"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved usage-critical"

  # Inodes. A filesystem with free space and no inodes fails in exactly the same
  # way as a full one, and reads as a mystery if you are only watching space.
  # Millions of small session or cache files are the usual cause.
  if inode usage > 85% for 3 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning inode"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved inode"

  # Mount flags changed. The case that matters is a filesystem remounted
  # read-only by the kernel after an I/O error: the machine keeps answering
  # pings, every check that only looks at space and inodes stays green, and
  # nothing can write. Flags do not change by themselves, so this is quiet
  # until it matters.
  #
  # NOTE, and it is the one exception in this whole integration: this incident
  # DOES NOT CLOSE BY ITSELF. Monit's fsflags test reports a *change*, not a
  # state, and has no success counterpart - so there is no `else if succeeded`
  # to write here, and writing one is a syntax error. Close it from the admin
  # console once the filesystem is back, or have whatever fixes the mount send:
  #
  #   alertloop-send --status resolved --dedupe-key "<host>:filesystem-root:fsflags"
  #
  # If you would rather have it resolve on its own, check writability with a
  # `check program` instead - worker-heartbeat.conf is the pattern, and a
  # program test does support `else if succeeded`.
  if changed fsflags then
    exec "/usr/local/bin/alertloop-monit firing critical fsflags"

