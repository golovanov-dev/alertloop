# PHP-FPM.
#
# COPY, THEN EDIT: the pidfile and the version in it are yours.
#
# The master process existing tells you almost nothing. PHP-FPM hangs with every
# worker blocked on a database that is not answering, and the master stays
# perfectly alive. That is why http-health.conf exists and why this file points
# at it: check the application through HTTP, not just the process table.

check process php-fpm with pidfile /run/php/php8.3-fpm.pid
  start program = "/bin/systemctl start php8.3-fpm"
  stop program  = "/bin/systemctl stop php8.3-fpm"

  if does not exist then
    exec "/usr/local/bin/alertloop-monit firing critical availability"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved availability"

  # Total memory across the master and every worker. A pool leaking memory
  # shows up here days before the machine starts swapping.
  if total memory usage > 80% for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning memory"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved memory"

  if total cpu usage > 90% for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning cpu"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved cpu"

  if 5 restarts within 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical restart-loop"

  # The FPM status page, if you have enabled `pm.status_path` in the pool
  # config. It answers only when a worker is free to answer it, which is
  # exactly the hang the PID check misses.
  #if failed host 127.0.0.1 port 9000 type tcp for 3 cycles then
  #  exec "/usr/local/bin/alertloop-monit firing critical protocol"
  #else if succeeded then
  #  exec "/usr/local/bin/alertloop-monit resolved protocol"
