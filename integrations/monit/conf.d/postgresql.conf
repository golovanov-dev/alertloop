# PostgreSQL.
#
# COPY, THEN EDIT: the pidfile path differs by distribution and major version
# (Debian/Ubuntu: /var/run/postgresql/16-main.pid, RHEL family:
# /var/lib/pgsql/16/data/postmaster.pid).
#
# Three checks, deliberately. A PID proves a process exists, not that it works:
# a PostgreSQL wedged on a full disk or an exhausted connection pool keeps its
# process alive and answers nothing. The protocol test is the one that tells you
# the database is actually usable.

check process postgresql with pidfile /var/run/postgresql/16-main.pid
  start program = "/bin/systemctl start postgresql"
  stop program  = "/bin/systemctl stop postgresql"

  # 1. The process is gone.
  if does not exist then
    exec "/usr/local/bin/alertloop-monit firing critical availability"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved availability"

  # 2. The port is not accepting connections, or 3. it accepts them but does not
  # speak PostgreSQL. `protocol pgsql` performs a real handshake.
  #
  # 3 cycles, not 1: a restart during a deploy should not page anyone.
  if failed host 127.0.0.1 port 5432 protocol pgsql for 3 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical protocol"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved protocol"

  # Memory is worth a warning long before the OOM killer makes the decision.
  if total memory usage > 80% for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning memory"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved memory"

  # Restart loops. A service that restarts 5 times in 5 cycles is failing to
  # start, and its process check will keep looking briefly healthy.
  if 5 restarts within 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical restart-loop"
