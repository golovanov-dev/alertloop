# The application's own health endpoint.
#
# COPY, THEN EDIT: one `check host` block per application, each with its own
# name - the name becomes part of the dedupe_key, so two applications must not
# share one.
#
# This is the check that catches what process checks cannot: the service is
# running, listening, and returning 500 to every request.

check host main-api with address 127.0.0.1
  # 3 cycles before alerting: a deploy or a restart is not an incident.
  if failed
    port 8000 protocol http
    request "/health/ready"
    status = 200
    timeout 5 seconds
    for 3 cycles
  then
    exec "/usr/local/bin/alertloop-monit firing critical http-health"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved http-health"

  # Slow is a different problem from broken, and worth its own incident: a
  # response that takes 5 seconds is usually the warning before the outage.
  if failed
    port 8000 protocol http
    request "/health/ready"
    with timeout 2 seconds
    for 5 cycles
  then
    exec "/usr/local/bin/alertloop-monit firing warning http-slow"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved http-slow"

