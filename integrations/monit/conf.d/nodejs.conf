# A Node.js application.
#
# COPY, THEN EDIT: the unit name, the port, and the health path are yours.
#
# Read this before choosing which block to enable. A Node application usually
# has no pidfile, because a systemd unit with `Type=simple` does not write one -
# so the `check process ... with pidfile` pattern the other examples use does
# not apply here, and copying it produces a check that reports a healthy app as
# down.
#
# There are three ways to watch one, in increasing order of usefulness.

# --- 1. Is the service running? -------------------------------------------
#
# Ask systemd, which is the thing that actually knows. Monit runs as root, so
# `systemctl` needs no extra privileges.
#
# The check name becomes the middle segment of the dedupe_key, so give one name
# per application - two apps sharing a name share their incidents.

check program node-app-service with path "/bin/systemctl is-active --quiet my-node-app"
  # Every minute. A unit's state does not change often enough to be worth
  # forking systemctl twice a minute.
  every 2 cycles

  if status != 0 for 2 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical availability"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved availability"

# --- 2. Is it answering? ---------------------------------------------------
#
# THIS IS THE ONE THAT MATTERS, and if you only enable one block, enable this.
#
# A blocked event loop - a synchronous JSON.parse over a huge payload, a tight
# loop, a promise chain waiting on a database that will never answer - leaves
# the process running, the port open, and the service `active`. Everything above
# stays green while nothing is served. Only a request finds it.
#
# Under a supervisor (PM2, nodemon, a Docker restart policy) block 1 is close to
# useless for a different reason: the supervisor restarts a crashing app faster
# than Monit looks, so a crash loop reads as healthy. This block still catches
# it, because a restarting app does not answer.

check host node-app with address 127.0.0.1
  # 3 cycles: a deploy restart is not an incident.
  if failed
    port 3000 protocol http
    request "/health"
    status = 200
    timeout 5 seconds
    for 3 cycles
  then
    exec "/usr/local/bin/alertloop-monit firing critical http-health"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved http-health"

  # Slow is a different incident from broken, and usually arrives first: an
  # event loop under strain answers, late, before it stops answering at all.
  if failed
    port 3000 protocol http
    request "/health"
    with timeout 2 seconds
    for 5 cycles
  then
    exec "/usr/local/bin/alertloop-monit firing warning http-slow"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved http-slow"

# --- 3. Is it leaking? -----------------------------------------------------
#
# Optional, and only for a unit that does write a pidfile (`PIDFile=` in the
# unit, or a process manager that maintains one). Node's heap grows to its
# limit by design, so alert well above normal and on a long window: the pattern
# worth catching is days of slow growth ending in an OOM kill at 4am, not one
# busy afternoon.
#
#check process node-app-process with pidfile /run/my-node-app.pid
#  start program = "/bin/systemctl start my-node-app"
#  stop program  = "/bin/systemctl stop my-node-app"
#
#  if total memory usage > 75% for 10 cycles then
#    exec "/usr/local/bin/alertloop-monit firing warning memory"
#  else if succeeded then
#    exec "/usr/local/bin/alertloop-monit resolved memory"
#
#  Restart loops need Monit to be the one restarting - see the long note in
#  php-fpm.conf. Under PM2 or a Docker restart policy the supervisor restarts
#  the app first and this never fires at all.
#
#  if does not exist then restart
#  if 5 restarts within 5 cycles then
#    exec "/usr/local/bin/alertloop-monit firing critical restart-loop"

# Matching on the command line is the other way to find a pidfile-less process,
# and it is a trap worth naming: `matching "node"` also matches your editor's
# language server, a running `npm install`, and every other Node process on the
# box. If you use it, match the full argument list, and check with
# `monit procmatch "<pattern>"` that it finds exactly one process.
#
#check process node-app-process matching "node /opt/my-node-app/dist/server.js"
