# A background worker: is it still doing anything?
#
# COPY, THEN EDIT. This is the check that catches a wedged worker, which the
# process check in worker-process.conf cannot see.
#
# How it works: the worker touches a file (or writes a timestamp somewhere)
# every time it completes a unit of work. examples/check-worker-heartbeat.sh
# compares that file's age against a limit and exits non-zero when it is stale.
# Monit runs it and reacts to the exit code.
#
# Choosing the limit: several times the worker's normal idle interval. A worker
# that polls every 30 seconds is not in trouble at 60; it is at 300.

check program payment-worker-heartbeat with path "/usr/local/bin/check-worker-heartbeat.sh /var/lib/app-heartbeats/payment-worker 300"
  # Every 2 minutes. Running a heartbeat check every 30 seconds costs more than
  # it tells you.
  every 4 cycles

  if status != 0 for 2 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical heartbeat"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved heartbeat"
