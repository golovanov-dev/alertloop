# MySQL and MariaDB.
#
# COPY, THEN EDIT: the pidfile path and the unit name differ by distribution
# (Debian/Ubuntu: /run/mysqld/mysqld.pid, unit `mysql`; RHEL family:
# /var/lib/mysql/<hostname>.pid, unit `mysqld`; MariaDB anywhere: unit
# `mariadb`). Confirm both before enabling:
#
#   systemctl show -p MainPID -p Id mysql
#   ss -lntp | grep 3306
#
# Three checks, for the same reason postgresql.conf has three: a PID proves a
# process exists, not that it works. A MySQL stuck in InnoDB crash recovery, out
# of connections, or wedged on a full disk keeps its process and answers
# nothing. The protocol test is the one that proves the database is usable.

check process mysql with pidfile /run/mysqld/mysqld.pid
  start program = "/bin/systemctl start mysql"
  stop program  = "/bin/systemctl stop mysql"

  # 1. The process is gone.
  if does not exist then
    exec "/usr/local/bin/alertloop-monit firing critical availability"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved availability"

  # 2. The port is closed, or 3. it is open and does not speak MySQL.
  # `protocol mysql` reads the server's greeting packet, which a listening
  # socket with a dead server behind it cannot produce.
  #
  # DO NOT add `username`/`password` here. Monit authenticates with
  # mysql_native_password, and MySQL 8.4 does not load that plugin by default -
  # the test would fail forever against a perfectly healthy server, which is the
  # worst kind of alert. The unauthenticated greeting test needs no account and
  # tells you what you actually want to know.
  #
  # 3 cycles, not 1: a restart during a deploy should not page anyone, and
  # InnoDB recovery after an unclean shutdown takes longer than one cycle.
  if failed host 127.0.0.1 port 3306 protocol mysql for 3 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical protocol"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved protocol"

  # Memory. The buffer pool is preallocated, so this alerts on real growth
  # beyond it - usually connections, temp tables, or a per-connection buffer set
  # far too high - long before the OOM killer picks the largest process on the
  # box, which is always the database.
  if total memory usage > 80% for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning memory"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved memory"

  # Restart loops, and why this one ships commented out.
  #
  # `N restarts within M cycles` counts restarts MONIT performed. Every action
  # in this file is `exec` - Monit never restarts anything here - so the counter
  # never moves and the rule never fires. A rule that cannot fire is worse than
  # no rule, because it reads as coverage.
  #
  # To make it real, Monit has to be the one doing the restarting:
  #
  #  if does not exist then restart
  #  if 5 restarts within 5 cycles then
  #    exec "/usr/local/bin/alertloop-monit firing critical restart-loop"
  #
  # Read what that trades before enabling it. Monit will restart the database on its
  # own, and the `exec` on `does not exist` above is gone - so AlertLoop no
  # longer hears about the outage Monit just fixed, only about a loop it could
  # not fix.
  #
  # And like `changed fsflags` in filesystem.conf, a restart-loop incident DOES
  # NOT CLOSE BY ITSELF: the test reports an event, not a state, so there is no
  # `else if succeeded` to write. Close it from the admin console.

# If MySQL listens only on a unix socket (`skip-networking`, or a bind-address
# that is not 127.0.0.1), the protocol test above cannot connect and will alert
# on a healthy server. Delete it and check the socket file instead - weaker, but
# honest.
#
# `check program`, not `check file`: Monit's file test requires a REGULAR file
# and reports a socket as invalid rather than as present, so `if does not exist`
# on a socket path never means what it looks like it means.
#check program mysql-socket with path "/bin/sh -c 'test -S /run/mysqld/mysqld.sock'"
#  every 2 cycles
#  if status != 0 for 2 cycles then
#    exec "/usr/local/bin/alertloop-monit firing critical socket"
#  else if succeeded then
#    exec "/usr/local/bin/alertloop-monit resolved socket"
