# System resources: CPU, memory, swap, load average.
#
# COPY, THEN EDIT. The thresholds below are a starting point, not a standard.
# A machine that is supposed to run at 95% CPU should not page anybody at 90%.
#
# `for 5 cycles` is the part that matters most: it is what separates a real
# problem from a backup job. With Monit's default 30-second cycle that is 2.5
# minutes of sustained load before anyone is told.

check system $HOST

  # CPU. Excludes iowait deliberately: a busy disk is a disk problem, and the
  # filesystem checks in filesystem.conf are where it belongs.
  if cpu usage (user) > 90% for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning cpu"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved cpu"

  # Memory. On a server with a large page cache this is real memory pressure,
  # not cache.
  if memory usage > 85% for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning memory"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved memory"

  # Swap. Any sustained swapping on a database or application server is worth
  # knowing about long before the machine becomes unresponsive.
  if swap usage > 50% for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning swap"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved swap"

  # Load average. THIS THRESHOLD IS PER MACHINE.
  #
  # Load is not normalised by CPU count: a load of 4 is idle on a 16-core box
  # and a crisis on a single-core VM. A usual starting point is 2x the core
  # count (`nproc`). The value below assumes 4 cores.
  if loadavg (5min) > 8 for 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing warning load"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved load"
