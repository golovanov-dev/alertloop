# A cron job that never ran.
#
# COPY, THEN EDIT: the path and the window are yours.
#
# This is the check people leave out, and it is the one that matters. A job
# that fails sends mail nobody reads; a job that silently stops running sends
# nothing at all. The failure modes it catches, none of which produce an error
# message anywhere:
#
#   - the cron daemon is not running
#   - somebody removed or edited the crontab entry
#   - the job hung and never finished
#   - the last run failed before it could record success
#   - the machine was down at the scheduled time
#
# How it works: the job's wrapper touches a file after a SUCCESSFUL run
# (cron-wrapper.sh does this). Monit checks that file's timestamp.
#
# Choosing the window: the schedule plus generous slack. A job that runs daily
# at 03:30 and takes 20 minutes gets 26 hours, not 24 - otherwise a run that
# starts a few minutes late alerts every morning, and an alert that fires every
# morning is an alert nobody reads.

check file daily-import-freshness with path /var/lib/app-heartbeats/daily-import.ok
  every 20 cycles

  # The file is missing: the job has never succeeded since this check was set
  # up. Do not alert immediately after installing - create the file once by
  # hand, or wait for the first successful run.
  if does not exist then
    exec "/usr/local/bin/alertloop-monit firing critical freshness"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved freshness"

  # 26 hours for a daily job.
  if timestamp > 26 hours then
    exec "/usr/local/bin/alertloop-monit firing critical freshness"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved freshness"
