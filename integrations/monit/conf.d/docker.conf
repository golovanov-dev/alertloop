# Docker, and the applications inside it.
#
# COPY, THEN EDIT.
#
# The important point first: `container is running` is NOT a health check.
# A container whose application deadlocked on the first request keeps running
# indefinitely and Docker reports it as up. Check the application through its
# HTTP endpoint - that is what http-health.conf does, and for containers it is
# not optional.
#
# This file covers the layer below: is the Docker daemon itself alive?

check process docker with pidfile /var/run/docker.pid
  start program = "/bin/systemctl start docker"
  stop program  = "/bin/systemctl stop docker"

  if does not exist then
    exec "/usr/local/bin/alertloop-monit firing critical availability"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved availability"

  if 5 restarts within 5 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical restart-loop"

# The daemon's socket, which can stop answering while the process lives.
check file docker-socket with path /var/run/docker.sock
  if does not exist then
    exec "/usr/local/bin/alertloop-monit firing critical socket"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved socket"

# One specific container, if you need it. Monit runs this as root, so the check
# does not need the docker group.
#
# Note what this proves and what it does not: it proves the container exists and
# Docker thinks it is running. It does not prove the application works.
