# AlertLoop itself.
#
# READ THIS BEFORE USING THIS FILE.
#
# If AlertLoop is down, Monit cannot report it THROUGH AlertLoop. The rule below
# will try, and it will fail, and the only record will be in Monit's own log.
# That is not a defect in the configuration; it is what "the notification
# service is the thing that broke" means. Nothing on this host can work around
# it.
#
# So this file does two things that do not depend on AlertLoop:
#   1. restarts it, which fixes the common case
#   2. leaves the failure in Monit's log and in Monit's own alert channel
#
# And one thing that does:
#   3. reports the recovery, which DOES work, because by then AlertLoop is up
#
# What actually covers the case: an uptime check from a DIFFERENT machine,
# notifying through a different provider. Configure that. See "Monitoring
# AlertLoop itself" in the repository's OPERATIONS.md.
#
# Give Monit its own mail configuration in monitrc so it can shout about this
# one without AlertLoop:
#
#   set mailserver smtp.example.com
#   set alert ops@example.com

check process alertloop with pidfile /run/alertloop.pid
  start program = "/bin/systemctl start alertloop"
  stop program  = "/bin/systemctl stop alertloop"

  # Restart first. Reporting comes second, because reporting may not work.
  if does not exist then restart
  if 3 restarts within 5 cycles then alert

  # Liveness: the process is answering HTTP at all.
  if failed
    host 127.0.0.1 port 8080 protocol http
    request "/health/live"
    status = 200
    timeout 5 seconds
    for 3 cycles
  then
    restart

  # Readiness: it can also reach its database. A ready check that fails while
  # liveness passes means AlertLoop is up and cannot store anything - restarting
  # will not fix that, so this one only alerts.
  if failed
    host 127.0.0.1 port 8080 protocol http
    request "/health/ready"
    status = 200
    timeout 5 seconds
    for 3 cycles
  then
    alert
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved self-check"

# If AlertLoop runs in Docker rather than under systemd, check the published
# port instead of a pidfile:
#
#check host alertloop with address 127.0.0.1
#  if failed port 8080 protocol http request "/health/ready" status = 200 for 3 cycles then alert
#  else if succeeded then
#    exec "/usr/local/bin/alertloop-monit resolved self-check"
