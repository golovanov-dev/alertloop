# Reachability through the public name, if you want it. This overlaps with
# http-health.conf on purpose and you usually want only one of the two: this one
# tests DNS, TLS, and the path a visitor takes, and fails when your DNS provider
# does; the one in http-health.conf tests the application on 127.0.0.1 and keeps
# working when the outside world cannot reach you. Pick by what you want to be
# woken for.
