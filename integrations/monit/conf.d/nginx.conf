# Nginx, and one certificate check per domain.
#
# COPY, THEN EDIT: the pidfile, and one certificate block per domain you serve.
#
# Two unrelated things live in this file because both belong to whoever runs the
# web server, and they fail on completely different timescales:
#
#   nginx is down          - now, and someone is already complaining
#   a certificate expires  - in three weeks, silently, and nobody is complaining
#
# The second is the one that actually catches people. A renewal hook that stopped
# working produces no error anywhere; you find out from a visitor, on a Sunday.

check process nginx with pidfile /run/nginx.pid
  start program = "/bin/systemctl start nginx"
  stop program  = "/bin/systemctl stop nginx"

  if does not exist then
    exec "/usr/local/bin/alertloop-monit firing critical availability"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved availability"

  # The port answers at all. Nginx keeps its master process alive while every
  # worker sits waiting on an upstream that will not answer, so this is worth
  # having on top of the PID check.
  #
  # NOTE: no `status = 200` here, deliberately. Port 80 almost always answers
  # with a 301 to https, and Monit passes any status below 400 unless you ask
  # for a specific one. Demanding 200 on port 80 alerts on a correct redirect.
  if failed
    host 127.0.0.1 port 80 protocol http
    request "/"
    timeout 5 seconds
    for 3 cycles
  then
    exec "/usr/local/bin/alertloop-monit firing critical protocol"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved protocol"

# --- Certificates: one block per domain ------------------------------------
#
# Needs Monit 5.15 or later for `certificate valid`. Check with `monit -V`.
#
# Why a separate `check host` and not another rule above: `every` applies to a
# whole check block, and a certificate does not need looking at twice a minute.
# The separate name also makes this its own incident, which is what you want -
# "the certificate expires in 20 days" is not the same page as "the site is
# down", and they must not close each other.
#
# The address is the DOMAIN, not 127.0.0.1, and that is the point: the check
# leaves the machine, resolves DNS, comes back through the public path, and
# validates the certificate that real visitors are actually served. If your
# host cannot reach its own public IP (no hairpin NAT), this will fail for a
# reason that has nothing to do with the certificate - test it once by hand
# before trusting it.
#
# 21 days, not 7. Let's Encrypt renews with 30 days remaining, so an alert at 21
# means renewal has already been failing for over a week and you still have
# three weeks to fix it calmly. Seven days is a weekend away from an outage.

check host example-com-cert with address example.com
  # Once an hour at Monit's default 30-second cycle.
  every 120 cycles

  if failed
    port 443
    with protocol https
    and certificate valid > 21 days
    use ssl options {verify: enable}
  then
    exec "/usr/local/bin/alertloop-monit firing warning certificate"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved certificate"

