# A cron job that FAILED.
#
# This file is a placeholder on purpose: nothing here checks anything.
#
# A failing cron job reports itself, at the moment it fails, from
# examples/cron-wrapper.sh. Monit cannot see a cron job's exit code - by the
# time Monit looks, the process is gone.
#
#   # /etc/cron.d/daily-import
#   30 3 * * * root /usr/local/bin/cron-wrapper.sh daily-import /usr/sbin/runuser -u app -- /opt/app/bin/import.sh
#
# The wrapper runs the job, keeps its exit code, reports `firing` on failure and
# `resolved` on the next success, and exits with the job's own code so cron's
# own mail still works.
#
# What the wrapper CANNOT tell you is that the job never ran at all - because
# nothing runs to tell you. That is what cron-freshness.conf is for. Use both:
# this one catches "it ran and broke", that one catches "it never ran".
