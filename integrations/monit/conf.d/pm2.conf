# PM2-managed Node applications.
#
# COPY, THEN EDIT: the user PM2 runs as, and one block per application.
#
# "The user PM2 runs as" means the account that is ALREADY running it - the one
# that ran `pm2 start`, which is whoever runs your deploy script. You are not
# creating an account for this, and on a small server the answer is usually
# `root`. Find it before you edit anything below:
#
#   systemctl list-units --type=service | grep -i pm2   # -> pm2-root.service
#   ps -eo user:20,args | grep '[P]M2.*God Daemon'      # -> the user, and PM2_HOME
#   ls -ld /root/.pm2 /home/*/.pm2
#
# Pass the wrong one and the check reports a healthy app as down, because PM2
# keeps a separate daemon - and a separate process list - per user.
#
# This file does NOT replace an HTTP check, and enabling it alone is a mistake.
# PM2 reporting `online` means the process exists and PM2 is happy with it - the
# app behind it can be returning 500 to everything, or blocked on an event loop
# that will never turn again. Pair every block here with a `check host` block in
# http-health.conf. Two checks, two different failures.
#
# What this adds that an HTTP check cannot see:
#
#   1. A crash loop faster than the HTTP check's window. PM2 revives a crashing
#      app in seconds; `for 3 cycles` is 90 seconds at the default cycle. An app
#      that dies and returns every 20 seconds never trips an HTTP test, and
#      loses every request that lands in the gaps.
#
#   2. `max_memory_restart`. PM2 kills and revives the process on its own, with
#      no crash and no error anywhere - forever, if the leak is real.
#
# Both show up in exactly one place: PM2's restart counter. That is what
# examples/check-pm2.sh watches.
#
# ONE INCIDENT PER APP, not per failure mode. `check program` distinguishes zero
# from non-zero exit and nothing finer, so "not online" and "restarting" share a
# dedupe_key. The detail is not lost: Monit records the script's output and
# passes it through as the incident's message, which will say which it was.
#
# The script forks `su - <user> -c 'pm2 jlist'` on every run, and PM2's CLI is a
# Node process - budget roughly a second per app per run. `every 2 cycles` keeps
# that to once a minute per app. Do not lower it.
#
# The check NAME is the middle segment of the dedupe_key, so give one name per
# application. Read the header of examples/check-pm2.sh before enabling this:
# there are two traps - the wrong PM2 daemon, and nvm - and both make this
# report a healthy app as down.

check program pm2-my-api with path "/usr/local/bin/check-pm2.sh root my-api"
  every 2 cycles

  if status != 0 for 2 cycles then
    exec "/usr/local/bin/alertloop-monit firing critical availability"
  else if succeeded then
    exec "/usr/local/bin/alertloop-monit resolved availability"

# A second application. Note the different check name AND the different app
# name - the two must not be confused, and neither may be shared.
#check program pm2-my-worker with path "/usr/local/bin/check-pm2.sh root my-worker"
#  every 2 cycles
#
#  if status != 0 for 2 cycles then
#    exec "/usr/local/bin/alertloop-monit firing critical availability"
#  else if succeeded then
#    exec "/usr/local/bin/alertloop-monit resolved availability"

# If PM2 runs as some other account, name it - `deploy` here is an example of a
# user that already exists on your machine, not one to create:
#
#check program pm2-my-api with path "/usr/local/bin/check-pm2.sh deploy my-api"
#
# If Node came from nvm, `pm2` is not on the PATH of the login shell the script
# uses. Pass the absolute path as a third argument - find it once with
# `su - <user> -c 'command -v pm2'`:
#
#check program pm2-my-api with path "/usr/local/bin/check-pm2.sh deploy my-api /home/deploy/.nvm/versions/node/v22.11.0/bin/pm2"
