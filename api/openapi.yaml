openapi: 3.0.3
info:
  title: AlertLoop API
  version: "1.0.0"
  description: >
    AlertLoop Community Edition API for ingesting operational events, business
    events, incidents, and audit entries, tracking their lifecycle, and
    inspecting delivery attempts across Email, Telegram, and Webhook channels.

    Note: `info.version` above is the version of this `/v1` API contract, which
    is stable; it is deliberately independent of the AlertLoop product version
    (see the repository CHANGELOG), which is still 0.x and ALPHA.
  license:
    name: AGPL-3.0-only
servers:
  - url: http://localhost:8080
    description: Local instance
tags:
  - name: events
    description: Event ingestion, listing, and lifecycle actions.
  - name: delivery
    description: Delivery attempt inspection and dead-letter replay.
  - name: routing
    description: >
      Inspection of the delivery routing table and a dry-run preview of where an
      event would be delivered. Both require the `full` scope.
  - name: system
    description: Health and readiness probes, aggregate counts, and build metadata.
paths:
  /v1/events:
    post:
      tags: [events]
      summary: Ingest an event
      description: >
        Creates an event and queues one delivery attempt for each channel its
        routing selects: every configured channel when the config has no
        `routing` section. See `GET /v1/routing`.


        What a repeated `dedupe_key` does depends on `status`. **Without
        `status`** the key is an idempotency key while the event is open: the
        existing open event is returned with HTTP 200, untouched, and no new
        deliveries are created. Once that event is resolved, the same key
        creates a new event. **With `status`** the key identifies an incident:
        `firing` refreshes the open incident with the newest severity, message,
        and payload (HTTP 200), and `resolved` closes it.


        A repeated `firing` creates no deliveries — a check that fails every
        minute must not notify every minute — unless it raises the severity:
        then an alert goes to each channel the new severity routes to that has
        had no alert for this incident. A muted incident gets none. The same or
        a lower severity notifies nobody.


        Closing an incident sends a **recovery notice** to the channels that
        received the alert — and to no others. Repeating a recovery does not
        notify twice. Turn it off with `notify_on_resolve: false` in the config
        file.


        Resolving an incident frees its `dedupe_key`, so the same failure
        recurring afterwards opens a new incident and notifies again.


        **Sources of an `ingest` key.** A key with `sources` in the config may
        report only those sources, and may refresh or resolve only events of
        those sources. Anything else gets 403 `source_not_allowed` and changes
        nothing. A key without `sources` works with every source.


        **Response.** A caller with scope `full` (the admin token included)
        gets the event and `outcome`. An `ingest` key gets only `id`, `state` and `outcome`.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/EventInput'
                - $ref: '#/components/schemas/EventResolveInput'
            examples:
              monit_firing:
                summary: A monitoring source reports a problem
                value:
                  status: firing
                  type: incident
                  severity: critical
                  source: monit
                  category: availability
                  message: PostgreSQL does not respond on port 5432
                  dedupe_key: server-01:postgresql:availability
                  payload:
                    host: server-01
                    service: postgresql
                    monit_event: Connection failed
              monit_resolved:
                summary: The same source reports the recovery
                description: >
                  A recovery identifies an incident rather than describing a new
                  event, so `dedupe_key` is the only required field.
                value:
                  status: resolved
                  dedupe_key: server-01:postgresql:availability
              incident:
                summary: A one-off application event (no lifecycle)
                value:
                  type: incident
                  severity: critical
                  source: feeds_worker
                  category: feeds
                  message: Feed processing failed
                  entity_type: developer
                  entity_id: "15"
                  trace_id: 9f2c-abc
                  dedupe_key: feeds:developer:15:flats
                  payload:
                    developer_id: 15
                    feed_type: flats
      responses:
        "201":
          description: Event created.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IngestResult'
                  - $ref: '#/components/schemas/IngestSummary'
        "200":
          description: >
            The incident already existed. Without `status` it is returned
            untouched; with `status: firing` it was refreshed with the newest
            report; with `status: resolved` it is now closed (or was already).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/IngestResult'
                  - $ref: '#/components/schemas/IngestSummary'
        "204":
          description: >
            Accepted, with no incident to return: `status: resolved` for a
            `dedupe_key` no event has ever carried. This is a success, not an
            error — a monitoring source may report a recovery after retention
            removed the incident, or after restarting without having seen the
            failure.
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          description: >
            `forbidden`: the credential lacks scope `ingest`.
            `source_not_allowed`: the key's `sources` do not include the
            request's `source`, or the `dedupe_key` belongs to an event of
            another source. Nothing is changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "413":
          description: >
            `request_too_large`: the request body exceeds 524288 bytes. Nothing
            is stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: >
            `invalid_transition`: `status: resolved` found the incident changed
            by other requests several times in a row and gave up; retry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429":
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [events]
      summary: List events
      description: >
        Newest first. Filters combine with AND and work with the cursor. A
        filter value outside its enum gets 400.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/EventType' } }
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - { name: state, in: query, schema: { $ref: '#/components/schemas/EventState' } }
        - { name: source, in: query, schema: { type: string }, description: Exact source. Not valid UTF-8 gets 400. }
        - name: q
          in: query
          description: >
            Events whose `message` contains this text, ignoring case (Cyrillic
            included). `%` and `_` match themselves. Empty means no filter; more
            than 200 characters or not valid UTF-8 gets 400. On PostgreSQL case folding follows
            the database `LC_CTYPE`: with `C` only ASCII letters are folded.
          schema: { type: string, maxLength: 200 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/events/{id}:
    get:
      tags: [events]
      summary: Get an event
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        "200":
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/events/{id}/ack:
    post: { $ref: '#/components/x-actions/ack' }
  /v1/events/{id}/resolve:
    post: { $ref: '#/components/x-actions/resolve' }
  /v1/events/{id}/mute:
    post: { $ref: '#/components/x-actions/mute' }
  /v1/events/{id}/unmute:
    post: { $ref: '#/components/x-actions/unmute' }
  /v1/events/{id}/escalate:
    post: { $ref: '#/components/x-actions/escalate' }
  /v1/delivery-attempts:
    get:
      tags: [delivery]
      summary: List delivery attempts
      description: >
        Newest first. Filters combine with AND. A `state`, `channel` or `kind`
        outside its enum gets 400.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DeliveryState' } }
        - { name: channel, in: query, schema: { $ref: '#/components/schemas/ChannelType' } }
        - { name: channel_name, in: query, schema: { type: string }, description: Filter by a specific configured channel name. }
        - { name: event_id, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/DeliveryKind' }, description: Filter alerts from recovery notices. }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        "200":
          description: A page of delivery attempts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAttemptList'
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/delivery-attempts/{id}/replay:
    post:
      tags: [delivery]
      summary: Replay a dead-lettered delivery attempt
      description: >
        Re-queues a `dead_letter` attempt as `pending` and resets `attempts` to
        0, so it gets a new cycle of up to `max_attempts` tries with backoff.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        "200":
          description: The re-queued attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAttempt'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: Attempt is not in the dead_letter state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/routing:
    get:
      tags: [routing]
      summary: Show the routing table in effect
      description: >
        Returns the resolved routing rules, in evaluation order, and the default
        channels for events that match no rule. When `configured` is false there
        is no `routing` section in the configuration and every event is
        delivered to every configured channel — which `default` then lists.
        Requires the `full` scope.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: The routing table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingTable'
              examples:
                configured:
                  value:
                    configured: true
                    rules:
                      - name: incidents-to-dev
                        match: { type: [incident] }
                        channels: [dev-telegram, dev-email]
                        catch_all: false
                      - name: orders-to-customer
                        match: { type: [business_event], category: ["order.*"] }
                        channels: [customer-telegram]
                        catch_all: false
                    default: [dev-telegram]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/routing/preview:
    post:
      tags: [routing]
      summary: Preview where an event would be delivered
      description: >
        Matches the given event fields against the routing rules and returns the
        rule that would fire and the channels it selects. Nothing is created and
        nothing is delivered, so rules can be checked on a live instance without
        raising false incidents. An empty `matched_rule` means no rule matched
        and `channels` holds the routing default. Requires the `full` scope.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingPreviewInput'
            examples:
              incident:
                value:
                  type: incident
                  severity: critical
                  source: feeds_worker
                  category: feeds
      responses:
        "200":
          description: The rule that would fire and the channels it selects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingPreview'
              examples:
                matched:
                  value:
                    matched_rule: incidents-to-dev
                    channels: [dev-telegram, dev-email]
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "413":
          description: >
            `request_too_large`: the request body exceeds 65536 bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/stats:
    get:
      tags: [system]
      summary: Aggregate counts and monitoring signals
      description: >
        Returns event counts grouped by event state, delivery-attempt counts
        grouped by delivery state, and four absolute signals for monitoring
        AlertLoop itself: open incidents, the age of the oldest due delivery,
        dead letters in the last 24 hours, and the last worker tick. A monitor
        can alert on each of them from a single reading. Requires the `read`
        scope.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Counts by state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
              examples:
                counts:
                  value:
                    events: { new: 12, acknowledged: 3, resolved: 41 }
                    deliveries: { pending: 2, sent: 55, dead_letter: 1 }
                    open_incidents: 9
                    oldest_due_delivery_age_seconds: 3
                    dead_letter_last_24h: 1
                    worker_last_tick_at: "2026-09-22T12:00:07Z"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /v1/info:
    get:
      tags: [system]
      summary: Build and edition metadata
      description: >
        Returns the running build's version plus edition and license identifiers.
        Used by the admin console About page. Requires the `read` scope.
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      responses:
        "200":
          description: Build and edition metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
              examples:
                release:
                  value:
                    version: v0.1.1
                    edition: community
                    license: AGPL-3.0-only
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "429":
          $ref: '#/components/responses/TooManyRequests'
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      description: Alias of `/health/live`. Both paths are supported and equivalent.
      responses:
        "200":
          description: Process is alive.
  /health/live:
    get:
      tags: [system]
      summary: Liveness probe (sub-path alias)
      description: >
        Identical to `/health`. Monitoring tools and orchestrators are
        overwhelmingly configured against the sub-path form.
      responses:
        "200":
          description: Process is alive.
  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      description: Alias of `/health/ready`. Both paths are supported and equivalent.
      responses:
        "200":
          description: Ready (database reachable).
        "503":
          description: Not ready.
  /health/ready:
    get:
      tags: [system]
      summary: Readiness probe (sub-path alias)
      description: Identical to `/ready`.
      responses:
        "200":
          description: Ready (database reachable).
        "503":
          description: Not ready.
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >
        A scoped API key or the admin token. Scopes: `ingest` (POST
        /v1/events only: create, refresh and resolve events by `dedupe_key`,
        limited to the key's `sources` when it has them), `read` (read
        events/deliveries/stats), `full` (all operations incl. state actions
        and replay). The admin token has full access. A
        request whose credential lacks the required scope returns HTTP 403.
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Same credential as ApiKeyAuth, sent as an `Authorization: Bearer <key>`
        header.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      description: >
        Page size, default 50. A value above 200 is lowered to 200. A value
        that is not a positive integer gets 400.
      schema: { type: integer, minimum: 1, maximum: 200 }
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor from a previous response. A malformed one gets 400.
      schema: { type: string }
  responses:
    BadRequest:
      description: >
        `validation_failed`: a field or query parameter is invalid (a filter
        outside its enum, `limit`, `cursor`, `q`), or `bad_request`: the body
        is not valid JSON. `error.message` names the parameter.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: >
        `rate_limited`: the per-client-IP limit, or for `POST /v1/events` the
        process-wide ingest limit, is exhausted (`rate_limit` in the config).
        Health and readiness probes are never limited.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: >
        `forbidden`: the credential lacks the required scope, or it is the demo
        admin token `change-me-admin` sent through a reverse proxy or from a
        public address.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  x-actions:
    ack: &action
      tags: [events]
      summary: Acknowledge an incident
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        "200":
          description: Updated event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/TooManyRequests' }
        "409":
          description: >
            The action is not allowed: the event is not an `incident` (actions
            apply to incidents only), the transition is not allowed from the
            current state, the event is already `resolved`, or it kept changing
            while the action was applied (retry). `error.code` is
            `invalid_transition`; `error.message` says which.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
      description: >
        Actions apply to `incident` events only; for a `business_event` or an
        `audit` entry the answer is 409. The server alone decides which
        transitions are allowed. `resolved` is final: no action leaves it.
        Repeating an action whose result is the current state (acknowledging an
        acknowledged incident) returns the event unchanged.
    resolve:
      <<: *action
      summary: Resolve an incident
      description: >
        Closes the incident and queues a recovery notice to the channels that
        received its alert, unless the incident is muted or
        `notify_on_resolve` is off. Resolving an incident that is already
        `resolved` returns 409 and sends nothing. Allowed from every other
        state. Incidents only.
    mute:
      <<: *action
      summary: Mute an incident
      description: >
        Stops notifications about the incident. Alert attempts not sent yet
        (`pending`, `failed`) become `cancelled`. An alert being sent at the
        moment of mute becomes `cancelled` when that send fails or is
        interrupted while the incident is still muted (acknowledged or
        resolved in the meantime, it is retried, and after a resolve no
        recovery follows it); if it goes out, it is `sent`. A `sent` alert is
        untouched.
        A `dead_letter` alert is not cancelled, and replaying it sends it. A
        muted incident sends no recovery notice, whether it is resolved by hand
        or by its source. Not allowed from `resolved`. Incidents only.
    unmute:
      <<: *action
      summary: Unmute an incident
      description: >
        Returns a muted incident to `new`, whatever its state before mute was
        (`acknowledged` or `escalated` is not restored). Cancelled alert
        attempts stay cancelled, and a severity rise that arrived during mute
        is not sent afterwards. Allowed only from `muted`. Incidents only.
    escalate:
      <<: *action
      summary: Mark an incident as escalated
      description: >
        Marks the incident as escalated; no notifications are sent and no
        channel changes. Automatic escalation (policies, on-call schedules) is
        a paid-edition feature. Allowed from every state except `resolved`,
        `muted` included. Incidents only.
  schemas:
    EventType:
      type: string
      enum: [incident, business_event, audit]
    Severity:
      type: string
      enum: [info, success, warning, error, critical]
    EventState:
      type: string
      enum: [new, acknowledged, resolved, muted, escalated]
      description: >
        Where the event stands in **triage** — who has looked at it. It is not
        the delivery state: an event whose notifications were all sent stays
        `new` until somebody acknowledges or resolves it. `GET
        /v1/delivery-attempts?event_id=...` answers "was it sent"; this field
        answers "has anyone dealt with it".


        Nothing changes it automatically. For an incident it moves through the
        actions on `/v1/events/{id}` (ack, resolve, mute, unmute, escalate) or
        through an ingested `status: resolved` carrying the same `dedupe_key`.
        The actions apply to incidents only. For a `business_event` or an
        `audit` entry — a submitted form, a completed order, an admin action —
        `new` is therefore a normal resting state, not a sign that delivery
        failed: such events record something that already happened and have
        nothing to close.
    ChannelType:
      type: string
      enum: [email, telegram, webhook]
    DeliveryState:
      type: string
      enum: [pending, sending, sent, failed, dead_letter, cancelled]
      description: >
        `sent` and `dead_letter` end a delivery that was attempted. `cancelled`
        is an alert of a muted incident that was not sent: it was waiting when
        the incident was muted, or it was being sent and that send failed or
        was interrupted. The worker does not take it, replay does not apply to
        it, and unmute does not queue it again.
    DeliveryKind:
      type: string
      enum: [alert, recovery]
      description: >
        What a delivery attempt announces. `alert` — something happened.
        `recovery` — the incident is over; created when an incident closes, and
        only for the channels that were told about it. Attempts created before
        0.4.0 read as `alert`.
    IngestStatus:
      type: string
      enum: [firing, resolved]
      description: >
        The lifecycle signal attached to an incoming report. Omitting it keeps
        the pre-0.4.0 idempotent-create semantics.


        It is meant for `incident` events — a condition that starts, persists,
        and ends. Business events and audit entries record something that has
        already happened and are normally sent without it; sending `firing` for
        them is accepted but logged as a warning, because of the trap described
        under `dedupe_key`.
    EventResolveInput:
      type: object
      required: [status, dedupe_key]
      description: >
        A recovery report. It identifies an incident and asserts that it is
        over; it does not describe an event to store, so it carries none of the
        event fields. Closing the open incident with this `dedupe_key` records
        `resolved_at` and frees the key for the next occurrence.
      properties:
        status:
          type: string
          enum: [resolved]
        dedupe_key:
          type: string
          description: The incident to close.
      additionalProperties: false
    EventInput:
      type: object
      required: [type, source, message]
      description: >
        A report that something happened. With `status: firing` it opens or
        refreshes an incident; without `status` it is an idempotent create.
        To close an incident, send an EventResolveInput instead.
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/IngestStatus'
          description: >
            `firing` — the problem is happening now; repeats refresh the open
            incident. `resolved` — the problem is over; closes the open incident
            carrying the same `dedupe_key`. Requires `dedupe_key` either way.
            Omit it to keep the pre-0.4.0 behaviour, where a repeated
            `dedupe_key` is a no-op.


            **Do not send `firing` for a stream of business events** (form
            submissions, orders) under one stable key: after the first report
            every repeat refreshes the same open event and creates no
            deliveries, so the notifications stop without any error. See
            `dedupe_key`.
        type: { $ref: '#/components/schemas/EventType' }
        severity: { $ref: '#/components/schemas/Severity' }
        source: { type: string }
        category: { type: string }
        message: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        trace_id: { type: string }
        dedupe_key:
          type: string
          description: >
            Without `status`, an idempotency key: repeated values return the
            existing event. With `status`, the identity of an incident — it must
            be stable for one logical check and must not contain a timestamp, a
            random id, a measured value, or error text that varies between
            reports. Required whenever `status` is present.


            **A stable key over a stream of business events silently stops the
            notifications.** `{"status":"firing","type":"business_event",
            "dedupe_key":"contact-form"}` is right for a monitoring check and
            wrong for a contact form: the first submission opens an event and
            notifies, and every later one refreshes that same open event and
            creates no delivery at all. Nothing fails and nothing is rejected,
            so the loss is only noticed when someone asks why the requests
            stopped arriving. For business events either omit `dedupe_key`
            entirely or make it unique per report (the request id).
        payload:
          type: object
          additionalProperties: true
          description: >
            Free-form JSON payload, at most 262144 bytes (400 above that). The
            whole request body is limited to 524288 bytes (413 above that).
    Event:
      type: object
      properties:
        id: { type: string }
        type: { $ref: '#/components/schemas/EventType' }
        severity: { $ref: '#/components/schemas/Severity' }
        state: { $ref: '#/components/schemas/EventState' }
        source: { type: string }
        category: { type: string }
        message: { type: string }
        entity_type: { type: string }
        entity_id: { type: string }
        trace_id: { type: string }
        dedupe_key: { type: string }
        payload: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_seen_at:
          type: string
          format: date-time
          description: >
            When the incident was last reported as still firing. Equal to
            `created_at` for an event reported once.
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When the incident was closed, by an ingested `status: resolved` or by
            the manual resolve action. Absent while the incident is open.
    IngestOutcome:
      type: string
      enum: [created, deduplicated, refreshed, resolved, already_resolved]
      description: >
        What the request did: `created` a new event; `deduplicated` returned the
        open event untouched (no `status`); `refreshed` the open incident
        (`firing`); `resolved` it; or found it `already_resolved`.
    IngestResult:
      description: The response to a caller with scope `full`.
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          required: [id, type, outcome]
          properties:
            outcome: { $ref: '#/components/schemas/IngestOutcome' }
    IngestSummary:
      type: object
      description: >
        The response to an `ingest` key, which may not read events.
      required: [id, state, outcome]
      additionalProperties: false
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/EventState' }
        outcome: { $ref: '#/components/schemas/IngestOutcome' }
    DeliveryAttempt:
      type: object
      properties:
        id: { type: string }
        event_id: { type: string }
        channel: { $ref: '#/components/schemas/ChannelType' }
        channel_name:
          type: string
          description: The specific configured channel instance this attempt targets.
        kind:
          allOf:
            - $ref: '#/components/schemas/DeliveryKind'
          description: Whether this attempt announces the incident or its recovery.
        state: { $ref: '#/components/schemas/DeliveryState' }
        attempts: { type: integer }
        max_attempts: { type: integer }
        next_retry_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor: { type: string }
    DeliveryAttemptList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DeliveryAttempt' }
        next_cursor: { type: string }
    RoutingMatch:
      type: object
      description: >
        Rule conditions. Values inside one field are OR-ed, fields are AND-ed,
        and an absent field constrains nothing. Comparison ignores case and
        surrounding whitespace. An empty match makes the rule a catch-all.
      properties:
        type:
          type: array
          items: { $ref: '#/components/schemas/EventType' }
        severity:
          type: array
          items: { $ref: '#/components/schemas/Severity' }
        min_severity:
          allOf:
            - $ref: '#/components/schemas/Severity'
          description: >
            Matches events at or above this alarm level. Ranks are info=10,
            success=10, warning=20, error=30, critical=40 — `success` shares
            `info`'s rank because this is an order of alarm, not of importance.
        source:
          type: array
          items: { type: string }
          description: Literal values, or a prefix with a trailing `*` (e.g. `feeds_*`).
        category:
          type: array
          items: { type: string }
          description: Literal values, or a prefix with a trailing `*` (e.g. `order.*`).
    RoutingRule:
      type: object
      properties:
        name: { type: string }
        match: { $ref: '#/components/schemas/RoutingMatch' }
        channels:
          type: array
          items: { type: string }
          description: >
            Channel names the event is delivered to. An empty list is deliberate
            suppression: the event is stored and nothing is delivered.
        catch_all:
          type: boolean
          description: True when the rule has no conditions and matches every event.
    RoutingTable:
      type: object
      properties:
        configured:
          type: boolean
          description: >
            False when no `routing` section is configured; every event is then
            delivered to every configured channel.
        rules:
          type: array
          items: { $ref: '#/components/schemas/RoutingRule' }
          description: Rules in evaluation order. The first match wins.
        default:
          type: array
          items: { type: string }
          description: Channels for events matching no rule. Empty means such events are not delivered.
    RoutingPreviewInput:
      type: object
      description: The event fields routing rules can look at. No event is created.
      properties:
        type: { $ref: '#/components/schemas/EventType' }
        severity:
          allOf:
            - $ref: '#/components/schemas/Severity'
          description: Defaults to `info`, as it does on ingestion.
        source: { type: string }
        category: { type: string }
    RoutingPreview:
      type: object
      properties:
        matched_rule:
          type: string
          description: Name of the rule that fired; empty when no rule matched.
        channels:
          type: array
          items: { type: string }
    Stats:
      type: object
      description: >
        Counts by state, and absolute signals for monitoring AlertLoop itself.
        Each count map contains only the states currently present in the
        database, so a state with zero rows is absent rather than 0. The four
        signals are always present; a signal with no value is `null`.
      required:
        - events
        - deliveries
        - open_incidents
        - oldest_due_delivery_age_seconds
        - dead_letter_last_24h
        - worker_last_tick_at
      properties:
        events:
          type: object
          description: Event counts keyed by event state.
          additionalProperties: { type: integer, format: int64 }
        deliveries:
          type: object
          description: Delivery-attempt counts keyed by delivery state.
          additionalProperties: { type: integer, format: int64 }
        open_incidents:
          type: integer
          format: int64
          description: Events of type `incident` that are not `resolved`.
        oldest_due_delivery_age_seconds:
          type: integer
          format: int64
          nullable: true
          description: >
            Whole seconds since the longest-waiting delivery attempt that the
            worker could take now became due (`pending` or `failed` with its
            retry time reached; a recovery waiting for its alert is not due).
            With a worker running it stays near `worker.poll_interval`; it
            grows while no worker takes attempts, or while one channel keeps
            every slot it may use busy. `null` when nothing is due.
        dead_letter_last_24h:
          type: integer
          format: int64
          description: >
            Delivery attempts that became `dead_letter` in the last 24 hours and
            are still there. A replayed attempt leaves the count.
        worker_last_tick_at:
          type: string
          format: date-time
          nullable: true
          description: >
            The last time any delivery worker polled the queue, in whole
            seconds. A running worker records it at most every 15 seconds, so
            it is at most 15 seconds plus `worker.poll_interval` old. `null`
            until a worker of version 0.7.0 or later has run against this
            database.
    Info:
      type: object
      properties:
        version:
          type: string
          description: Build version baked in at compile time; `dev` for an untagged local build.
        edition:
          type: string
          description: Always `community` in this repository.
          example: community
        license:
          type: string
          example: AGPL-3.0-only
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
