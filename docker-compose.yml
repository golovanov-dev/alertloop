# AlertLoop — one Compose file, two profiles; run exactly one:
#   demo      one container on SQLite, loopback only, no setup
#   postgres  api and worker on PostgreSQL; needs alertloop.yaml and .env
#
#   cp .env.example .env      # COMPOSE_PROFILES selects the profile
#   docker compose up -d --wait --wait-timeout 120
#
# Create alertloop.yaml before starting the postgres profile: Docker would
# otherwise create the missing mount source as a directory.

name: alertloop

# The release this file belongs to; ALERTLOOP_IMAGE in .env overrides it.
# Not :latest: `docker compose pull` would upgrade, and migrations are one-way.
x-image: &image ${ALERTLOOP_IMAGE:-ghcr.io/golovanov-dev/alertloop:0.8.0}

# Container log rotation: 10 MB x 3 per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# No privilege escalation, no capabilities, read-only root filesystem.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  logging: *logging
  restart: unless-stopped

# Readiness includes the database, so "healthy" means it can store events.
x-http-health: &http-health
  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s

# Outbound proxy for the channels, from .env; empty means none.
x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}

# Shared by api and worker. An empty admin token stops startup (the config file
# has no fallback); a Compose `:?` here would also block the demo profile.
x-pg-env: &pg-env
  ALERTLOOP_ADMIN_TOKEN: ${ALERTLOOP_ADMIN_TOKEN:-}
  ALERTLOOP_DB_DRIVER: postgres
  # Keyword/value DSN, password unquoted and last: POSTGRES_PASSWORD must have
  # no spaces, no backslashes and no leading single quote.
  ALERTLOOP_DB_DSN: host=postgres port=5432 user=alertloop dbname=alertloop sslmode=disable password=${POSTGRES_PASSWORD}

services:
  # --- demo profile ------------------------------------------------------
  # Delivers nothing until you mount a config with channels:
  #   volumes: ["./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro"]
  alertloop:
    profiles: ["demo"]
    image: *image
    ports:
      # Loopback only: a published Docker port bypasses ufw/firewalld.
      - "127.0.0.1:${ALERTLOOP_PORT:-8080}:8080"
    environment:
      <<: *proxy-env
      # Fallback for the loopback-only demo; the postgres profile has none.
      ALERTLOOP_ADMIN_TOKEN: ${ALERTLOOP_ADMIN_TOKEN:-change-me-admin}
    volumes:
      - alertloop-data:/data
    healthcheck: *http-health
    <<: *hardening

  # --- postgres profile --------------------------------------------------
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    # No ports: PostgreSQL stays on the internal network.
    environment:
      POSTGRES_USER: alertloop
      # The image refuses to initialise with an empty password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: alertloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertloop"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  api:
    profiles: ["postgres"]
    image: *image
    command: ["--config", "/etc/alertloop/alertloop.yaml", "server"]
    environment:
      <<: [*pg-env, *proxy-env]
      ALERTLOOP_LOG_FILE: ${ALERTLOOP_LOG_FILE_API:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALERTLOOP_PORT:-8080}:8080"
    healthcheck: *http-health
    volumes:
      - ./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro
      # Log files, if enabled in .env; the directory must belong to uid 10001.
      - ./logs:/var/log/alertloop
    <<: *hardening

  worker:
    profiles: ["postgres"]
    image: *image
    command: ["--config", "/etc/alertloop/alertloop.yaml", "worker"]
    environment:
      <<: [*pg-env, *proxy-env]
      ALERTLOOP_LOG_FILE: ${ALERTLOOP_LOG_FILE_WORKER:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Started, not healthy: plain `up -d` would hang on an api in a restart loop.
      api:
        condition: service_started
    # No HTTP here: check-db checks the config and the database as a start would.
    healthcheck:
      test: ["CMD", "alertloop", "--config", "/etc/alertloop/alertloop.yaml", "check-db"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro
      - ./logs:/var/log/alertloop
    <<: *hardening

volumes:
  alertloop-data:
  pgdata:
