# AlertLoop — the one Compose file.
#
# Two profiles live here so they cannot drift apart the way two separate files
# did:
#
#   demo      one all-in-one container on SQLite. Loopback only, no setup.
#   postgres  separate api and worker containers on PostgreSQL. Production.
#
# Pick exactly one. Both publish the same host port (8080, or ALERTLOOP_PORT
# from .env), so running them together fails.
#
#   cp .env.example .env      # COMPOSE_PROFILES=demo is preset there
#   docker compose up -d --wait --wait-timeout 120
#
# --wait is what makes a failed start visible. Plain `up -d` returns as soon as
# the containers are created, so a service that then fails and restarts in a
# loop looks exactly like a working one. With --wait, Compose waits for every
# health check below to pass, and exits non-zero if one does not within the
# timeout. `docker compose ps` then shows which service it was.
#
# For production, EDIT that line to COMPOSE_PROFILES=postgres and run the same
# command. Do NOT pass --profile on top of the variable: for that one command
# the flag REPLACES it, so the command acts on a different deployment than the
# rest — `--profile postgres up` next to a running demo collides on the port.
#
# The postgres profile needs two things first:
#   1. cp alertloop.example.yaml alertloop.yaml   and edit it. Create the file
#      BEFORE starting: Docker creates a missing bind-mount source as a
#      directory, and `up` then fails with its own error, "not a directory ...
#      Are you trying to mount a directory onto a file (or vice-versa)?".
#   2. set ALERTLOOP_ADMIN_TOKEN and POSTGRES_PASSWORD in .env
#                                                  (openssl rand -hex 32, each)
# It refuses to start without them rather than running on a placeholder
# published in this repository.
#
# Images are pulled from GHCR; nothing is built from this file. To run a build
# of your own:  make docker  then  ALERTLOOP_IMAGE=alertloop:$(git describe) …

name: alertloop

# The published image. Pinning a version instead of `latest` is the right thing
# to do in production — `latest` moves under you on the next `docker compose
# pull`, which is precisely what you do not want from an alerting service.
x-image: &image ${ALERTLOOP_IMAGE:-ghcr.io/golovanov-dev/alertloop:latest}

# Container log rotation. Without it the json-file driver grows without bound
# until the disk fills — the failure OPERATIONS.md already carries a runbook
# for, and one an alerting service must not cause itself. 10 MB x 3 per
# container is enough to look back over an incident and small enough to forget
# about. Change the driver here if your host ships logs elsewhere (journald,
# local, a collector); max-size/max-file apply to json-file and local only.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Hardening shared by every AlertLoop container: no privilege escalation, no
# Linux capabilities (it binds 8080 and writes only to its volume), a read-only
# root filesystem, and a writable tmpfs for scratch files.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  logging: *logging
  restart: unless-stopped

# Health of a process that serves HTTP: the demo container and the api. The
# readiness probe answers only when the database does, so "healthy" means the
# service is up AND can store events. The image's busybox wget does the
# request; it writes nothing to disk and needs no capabilities, so it works on
# the read-only, capability-less containers above.
x-http-health: &http-health
  test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/ready"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 30s

# Environment shared by the api and the worker. They run the same config file
# and must see the same secrets; only the log file differs, per service.
x-pg-env: &pg-env
  # Empty when unset, on purpose. AlertLoop treats empty as unset, and
  # alertloop.example.yaml references ${ALERTLOOP_ADMIN_TOKEN} with no
  # fallback — so a missing token stops the container with a message naming
  # it, instead of starting on a placeholder published in this repository.
  #
  # The guard lives in the config file rather than as a Compose `:?` because
  # Compose interpolates the WHOLE file before it filters by profile: a `:?`
  # here would also block `docker compose --profile demo up`, which needs
  # none of these secrets.
  ALERTLOOP_ADMIN_TOKEN: ${ALERTLOOP_ADMIN_TOKEN:-}
  # The same example config serves the binary and both profiles: it reads
  # the driver and DSN from these references, defaulting to SQLite when they
  # are absent. Referencing them from the config is the supported way to
  # inject a secret — a *leftover* one that the file does not reference is
  # what AlertLoop refuses to start on.
  ALERTLOOP_DB_DRIVER: postgres
  # Keyword/value, not a postgres:// URL. Compose pastes the password in as
  # text, and in a URL a "/", "?" or "#" in it ends the user:password part —
  # the DSN stops parsing and both containers restart in a loop. Keyword/value
  # gives those characters no meaning.
  #
  # The password is deliberately unquoted and last: unquoted, a single quote
  # inside it works (quoting would break it), and last, nothing follows it.
  # Keyword/value still gives three things a meaning. Whitespace ends the
  # value — "ab c=d" arrives as password "ab" plus a setting c=d, and
  # "ab dbname=x" switches the database. A backslash escapes the next
  # character ("\\" becomes one backslash). A leading single quote opens a
  # quoted value and fails to parse. Any other password arrives exactly as
  # written; one from `openssl rand -hex 32` always does.
  ALERTLOOP_DB_DSN: host=postgres port=5432 user=alertloop dbname=alertloop sslmode=disable password=${POSTGRES_PASSWORD}

services:
  # --- demo profile ------------------------------------------------------
  # Stores events and serves the API, the admin console, and Swagger. It
  # delivers nothing until channels are configured: mount your own config with
  #   volumes: ["./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro"]
  # (see alertloop.example.yaml).
  alertloop:
    profiles: ["demo"]
    image: *image
    ports:
      # Loopback only: the demo is reachable at http://localhost:8080 and not
      # from other hosts. A published Docker port bypasses host firewalls such
      # as ufw, so do NOT bind 0.0.0.0 here. For remote access put the reverse
      # proxy from deploy/proxy/ in front of it.
      #
      # ALERTLOOP_PORT in .env moves the HOST side only, for when 8080 is taken.
      # Inside the container AlertLoop always listens on 8080. The variable is
      # read by Compose to fill in this line and is not passed to the container.
      - "127.0.0.1:${ALERTLOOP_PORT:-8080}:8080"
    environment:
      # The image ships a config file that reads the token from this variable.
      # It signs in to /admin AND grants full API access. The demo has a
      # fallback because it is loopback-only; the postgres profile does not.
      ALERTLOOP_ADMIN_TOKEN: ${ALERTLOOP_ADMIN_TOKEN:-change-me-admin}
    volumes:
      - alertloop-data:/data
    healthcheck: *http-health
    <<: *hardening

  # --- postgres profile --------------------------------------------------
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    # No `ports:` — PostgreSQL stays on the internal Docker network and is
    # never published to the host. Keep it that way.
    environment:
      POSTGRES_USER: alertloop
      # The postgres image itself refuses to initialise with an empty password,
      # so a missing one fails loudly at startup rather than quietly creating a
      # trust-authenticated database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: alertloop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertloop"]
      interval: 10s
      timeout: 5s
      retries: 5
    # The Postgres image needs a writable data directory and the capabilities to
    # drop from root to the postgres user, so it gets only no-new-privileges.
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped

  api:
    profiles: ["postgres"]
    image: *image
    command: ["--config", "/etc/alertloop/alertloop.yaml", "server"]
    environment:
      <<: *pg-env
      # This service writes its log to this file IN ADDITION to stdout, so
      # `docker compose logs api` keeps working. Empty by default — see the
      # ./logs mount below before turning it on.
      ALERTLOOP_LOG_FILE: ${ALERTLOOP_LOG_FILE_API:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only, host port from ALERTLOOP_PORT — see the demo service.
      - "127.0.0.1:${ALERTLOOP_PORT:-8080}:8080"
    healthcheck: *http-health
    volumes:
      # Both containers mount the SAME file, so channels and routing are defined
      # once and cannot drift between the API and the worker.
      - ./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro
      # Where log.file can land. The root filesystem is read-only, so this bind
      # mount is the only writable place for logs — and being a bind mount, what
      # lands there are ordinary host files that tail, grep and less can read.
      #
      # It stays unused until ALERTLOOP_LOG_FILE_API / ALERTLOOP_LOG_FILE_WORKER
      # are set in .env. Before setting them:
      #   mkdir -p logs && sudo chown 10001:10001 logs
      # Compose creates a missing source directory as root, and the container
      # runs as uid 10001 — it would stop at startup on "permission denied".
      - ./logs:/var/log/alertloop
    <<: *hardening

  worker:
    profiles: ["postgres"]
    image: *image
    command: ["--config", "/etc/alertloop/alertloop.yaml", "worker"]
    environment:
      <<: *pg-env
      # A separate file from the one the api writes: the two share a config file
      # on purpose, but two processes appending to and rotating one log would
      # cut each other's history short. Most of what an incident needs —
      # deliveries, retries, dead-letter, retention — is written here.
      ALERTLOOP_LOG_FILE: ${ALERTLOOP_LOG_FILE_WORKER:-}
    depends_on:
      postgres:
        condition: service_healthy
      # Started, deliberately not healthy: with service_healthy a plain
      # `docker compose up -d` would wait forever on an api that restarts in a
      # loop. Both processes run the migrations at startup, and that is safe
      # without ordering: each migration is one transaction recorded under a
      # primary key, so the loser of a race rolls back and finds it applied.
      api:
        condition: service_started
    # The worker serves no HTTP, so its check is the binary itself: check-db
    # loads the same config file and pings the database. It proves the worker's
    # configuration loads and its database answers; it does not watch the
    # delivery loop. A worker that cannot start never becomes healthy, and that
    # is what `up --wait` reports. The image's own HEALTHCHECK probes HTTP and
    # would call this container unhealthy forever, so it is replaced here.
    healthcheck:
      test: ["CMD", "alertloop", "--config", "/etc/alertloop/alertloop.yaml", "check-db"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - ./alertloop.yaml:/etc/alertloop/alertloop.yaml:ro
      - ./logs:/var/log/alertloop
    <<: *hardening

  # The admin console is served by the api container at /admin, on the same
  # origin as the API. There is no separate UI service to run.

volumes:
  alertloop-data:
  pgdata:
